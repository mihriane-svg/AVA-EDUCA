<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVA-EDUCA - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <form id="form-login">
        <div>
            <label for="usuario">Email</label>
            <input id="usuario" type="email" placeholder="Digite e-mail de usuário" required>
        </div>
        <div>
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="Senha" required>
            <button id="btnMostrarSenha" type="button">Mostrar Senha</button>
        </div>

        <a href="#" id="esqueci-senha">Esqueci minha senha</a>
        <button id="btnEntrar" type="submit">Entrar</button>

        <p id="mensagem-erro" class="mensagem-erro"></p>
    </form> 

    <!-- o script que controla esta tela -->
    <script type="module" src="./login.js"></script>
</body>
</html>
