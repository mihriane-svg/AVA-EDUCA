<!DOCTYPE html>
<html lang="pt=BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>

    <!--Link do CSS
    <link rel="stylesheet" href="cadastro-aluno.css">-->

    <!--CDN do Moment.js-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Cadastro de Aluno</h2>
        <form id="form-cadastro-aluno" autocomplete="off">
    <label for="nome">Nome Completo:</label>
    <input type="text" id="nome" required minlength="4" maxlength="80">

    <label for="genero">Gênero:</label>
    <select id="genero" required>
        <option value="">Selecione...</option>
        <option value="Masculino">Masculino</option>
        <option value="Feminino">Feminino</option>
        <option value="Outro">Outro</option>
    </select>

    <label for="dataNascimento">Data de Nascimento:</label>
    <input type="date" id="dataNascimento" required>

    <label for="cpf">CPF:</label>
    <input type="text" id="cpf" required placeholder="000.000.000-00">

    <label for="telefone">Telefone:</label>
    <input type="text" id="telefone" required placeholder="(00) 00000-0000">

    <label for="email">E-mail:</label>
    <input type="email" id="email" required>

    <label for="cep">CEP:</label>
    <input type="text" id="cep" required placeholder="00000-000" maxlength="8">

    <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" required>

    <label for="estado">Estado (UF):</label>
    <input type="text" id="estado" required maxlength="2">

    <label for="logradouro">Logradouro:</label>
    <input type="text" id="logradouro" required>

    <label for="numero">Número:</label>
    <input type="text" id="numero" required>

    <label for="complemento">Complemento:</label>
    <input type="text" id="complemento">

    <label for="bairro">Bairro:</label>
    <input type="text" id="bairro" required>

    <button type="submit">Salvar</button>
</form>
    </div>
<script type="module" src="cadastro-aluno.js"></script>
</body>
</html>
